name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest

  deploy-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image named in the manifest
        run: |
          IMAGE=$(grep 'image:' k8s/deployment.yaml | awk '{print $2}')
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Load the image into the cluster
        run: kind load docker-image "$IMAGE" --name ci

      - name: Deploy
        run: kubectl apply -f k8s/

      - name: Wait for the rollout
        run: kubectl rollout status deployment/flask-app --timeout=120s

      - name: Smoke test
        run: |
          kubectl port-forward service/flask-app 8080:80 &
          sleep 5
          curl --fail http://localhost:8080/health
          curl --fail http://localhost:8080/

      - name: Show cluster details if something failed
        if: failure()
        run: |
          kubectl get pods
          kubectl describe pods
          kubectl logs -l app=flask-app --tail=50